<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Практическая работа 2</title>
</head>
<body>
    <form name="form1">
        <h1>Угадайка!</h1>
        <p>Укажите интервал чисел для угадывания</p>
        <p>С <input type="text" id="min-val" size="20" placeholder="минимальное"> по <input id="max-val" size="20" type="text" placeholder="максимальное"></p>
        <div class="gt">
       <button type="button" id="save">Сохранить</button>
        <button type="button" id="cancel">Отмена</button>
        </div>

        <div class="kont" id="game-panel">
            <div class="con">
                <input type="text" id="gu" placeholder="Введите число">
                <button type="button" id="go">Go!</button>
            </div>
            
            <p>Попытка № <span id="count">0</span></p>
            <p id="result"></p>
        </div>
    </form>

    <script src="js.js"></script>
</body>
</html>
